<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="400" viewBox="0 0 1240 400" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="2"/><feOffset dy="1.5" result="b"/><feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="0" y="0" width="1240" height="400" rx="18" fill="#ffffff"/>
<text x="620.0" y="40.0" font-size="22" fill="#0f172a" text-anchor="middle" font-weight="700">What happens in every step</text>
<text x="620.0" y="62.0" font-size="13" fill="#64748b" text-anchor="middle">Each step runs as its own process, so the app stays responsive and a step can be stopped at any time.</text>
<rect x="40.0" y="104.0" width="230.0" height="66.0" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" filter="url(#sh)"/>
<text x="155.0" y="130.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Settings</text>
<text x="155.0" y="150.0" font-size="12" fill="#4b5563" text-anchor="middle">project.yaml (edit in the app)</text>
<rect x="40.0" y="214.0" width="230.0" height="66.0" rx="12" fill="#ffffff" stroke="#93c5fd" stroke-width="1.6" filter="url(#sh)"/>
<text x="155.0" y="240.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Earlier outputs</text>
<text x="155.0" y="260.0" font-size="12" fill="#4b5563" text-anchor="middle">+ the current model</text>
<rect x="330.0" y="150.0" width="200.0" height="86.0" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.6" filter="url(#sh)"/>
<text x="430.0" y="176.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Step runs</text>
<text x="430.0" y="196.0" font-size="12" fill="#4b5563" text-anchor="middle">logs → logs/&lt;step&gt;.log</text>
<text x="430.0" y="213.0" font-size="12" fill="#4b5563" text-anchor="middle">progress → the app</text>
<rect x="590.0" y="96.0" width="260.0" height="66.0" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
<text x="720.0" y="122.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Outputs</text>
<text x="720.0" y="142.0" font-size="12" fill="#4b5563" text-anchor="middle">frames, features, models/&lt;name&gt;</text>
<rect x="590.0" y="184.0" width="260.0" height="66.0" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
<text x="720.0" y="210.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Report</text>
<text x="720.0" y="230.0" font-size="12" fill="#4b5563" text-anchor="middle">checks · metrics · figures</text>
<rect x="910.0" y="184.0" width="290.0" height="66.0" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6" filter="url(#sh)"/>
<text x="1055.0" y="210.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Results / Issues tabs</text>
<text x="1055.0" y="230.0" font-size="12" fill="#4b5563" text-anchor="middle">each check: pass · warn · fail</text>
<rect x="910.0" y="96.0" width="290.0" height="66.0" rx="12" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.6" filter="url(#sh)"/>
<text x="1055.0" y="122.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Next step</text>
<text x="1055.0" y="142.0" font-size="12" fill="#4b5563" text-anchor="middle">or “Run from here to the end”</text>
<rect x="590.0" y="296.0" width="610.0" height="66.0" rx="12" fill="#ffffff" stroke="#fdba74" stroke-width="1.6" filter="url(#sh)"/>
<text x="895.0" y="322.0" font-size="14" fill="#111827" text-anchor="middle" font-weight="700">Fix</text>
<text x="895.0" y="342.0" font-size="12" fill="#4b5563" text-anchor="middle">change the suggested setting, or press Apply on a Diagnose issue</text>
<path d="M274,137 L300,137 L300,180 L326,180" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M274,247 L300,247 L300,206 L326,206" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M534,180 L560,180 L560,129 L586,129" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M534,206 L560,206 L560,217 L586,217" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M854,217 L906,217" fill="none" stroke="#475569" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M1055.0,180 L1055.0,166" fill="none" stroke="#059669" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="1069.8" y="163.0" width="38.3" height="19" rx="9.5" fill="#ecfdf5" stroke="#047857" stroke-width="1"/>
<text x="1089.0" y="177.0" font-size="11.5" fill="#047857" text-anchor="middle">pass</text>
<path d="M1055.0,254 L1055.0,292" fill="none" stroke="#c2410c" stroke-width="1.8" marker-end="url(#arrA)"/>
<rect x="1072.5" y="263.0" width="68.9" height="19" rx="9.5" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
<text x="1107.0" y="277.0" font-size="11.5" fill="#c2410c" text-anchor="middle">warn / fail</text>
<path d="M586,329 L22,329 L22,137 L36,137" fill="none" stroke="#c2410c" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
<rect x="276.5" y="319.0" width="47.0" height="19" rx="9.5" fill="#fff7ed" stroke="#c2410c" stroke-width="1"/>
<text x="300.0" y="333.0" font-size="11.5" fill="#c2410c" text-anchor="middle">re-run</text>
</svg>