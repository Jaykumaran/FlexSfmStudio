<text x="461.1" y="296.0" font-size="14" fill="#111827" text-anchor="start" font-weight="700">Keypoints</text>
<text x="485.2" y="316.0" font-size="12" fill="#4b5563" text-anchor="middle">SIFT / ALIKED keypoints,</text>
<text x="485.2" y="333.0" font-size="12" fill="#4b5563" text-anchor="middle">FlexGlue + global descriptors</text>
